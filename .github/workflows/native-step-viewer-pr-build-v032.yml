name: PR Build Native STEP Viewer v0.3.2

on:
  pull_request:
    branches:
      - native-step-viewer-build-base-v032

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "cadquery==2.6.1" "PySide6==6.9.1" "pyqtgraph==0.13.7" "PyOpenGL==3.1.9" "pyinstaller==6.15.0"

      - name: Source syntax check
        shell: pwsh
        run: |
          python -m py_compile native-step-viewer/app.py

      - name: Generate STEP smoke-test model
        shell: pwsh
        run: |
          @'
          import cadquery as cq
          model = cq.Workplane("XY").box(20, 30, 10).edges().fillet(1.5)
          cq.exporters.export(model, "native-step-viewer/sample.step")
          '@ | python -

      - name: Parser self-test before packaging
        shell: pwsh
        run: |
          python native-step-viewer/app.py --selftest native-step-viewer/sample.step | Tee-Object native-step-viewer/selftest-source.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows native app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name CapsuleSTEPViewer --collect-all OCP --collect-all cadquery --collect-all pyqtgraph --hidden-import OpenGL --distpath native-step-viewer/dist --workpath native-step-viewer/build --specpath native-step-viewer native-step-viewer/app.py

      - name: Packaged EXE self-test
        shell: pwsh
        run: |
          $exe = "native-step-viewer/dist/CapsuleSTEPViewer/CapsuleSTEPViewer.exe"
          & $exe --selftest native-step-viewer/sample.step | Tee-Object native-step-viewer/selftest-packaged.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $txt = Get-Content native-step-viewer/selftest-packaged.txt -Raw
          if ($txt -notmatch '"ok": true') { throw "Packaged self-test did not report ok=true" }

      - name: Verify pivot patch is present
        shell: pwsh
        run: |
          $src = Get-Content native-step-viewer/app.py -Raw
          if ($src -notmatch "_pick_world_position") { throw "Point picking missing" }
          if ($src -notmatch "_set_orbit_pivot") { throw "Orbit pivot missing" }
          if ($src -notmatch "glReadPixels") { throw "Depth picking missing" }
          if ($src -notmatch 'APP_VERSION = "0.3.2"') { throw "Version mismatch" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          Push-Location native-step-viewer
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Create portable package
        shell: pwsh
        run: |
          $dist = "native-step-viewer/dist"
          Compress-Archive -Path "$dist/CapsuleSTEPViewer" -DestinationPath "$dist/CapsuleSTEPViewer_Portable_v0.3.2.zip" -Force
          @(
            "CapsuleDesign STEP Viewer v0.3.2",
            "",
            "Interaction patch:",
            "- Left-click on model sets clicked surface point as orbit pivot",
            "- Drag after click rotates around that point",
            "- Ctrl+left drag keeps pan behavior",
            "- Pivot is marked with a small lime point",
            "",
            "Also includes v0.3.1 display fixes:",
            "- No center grid plane",
            "- Bright CAD shading",
            "- Only real STEP B-Rep edges",
            "",
            "Native Windows x64 / Qt + OpenGL + OCCT",
            "No browser / No WebView / No localhost"
          ) | Set-Content -Encoding UTF8 "$dist/README_NATIVE.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: CapsuleSTEPViewer-v0.3.2-PivotOrbit
          path: |
            native-step-viewer/dist/CapsuleDesign_STEPViewer_Setup_v0.3.2.exe
            native-step-viewer/dist/CapsuleSTEPViewer_Portable_v0.3.2.zip
            native-step-viewer/dist/README_NATIVE.txt
            native-step-viewer/selftest-source.txt
            native-step-viewer/selftest-packaged.txt
          retention-days: 7
