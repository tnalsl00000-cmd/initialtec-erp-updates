name: Publish verified ERP 1.1.174
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-erp-1174.yml']
permissions:
  contents: write
concurrency:
  group: initialtec-public-update-recovery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish completed ERP artifact
        shell: pwsh
        env:
          ARTIFACT_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-2478-8207-b1a0-424e1908806e/raw?se=2026-10-08T01%3A07%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=2bc1c0e4-19ef-4987-aafb-ee8fb1b393b8&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T23%3A28%3A26Z&ske=2026-10-08T23%3A28%3A26Z&sks=b&skv=2026-02-06&sig=H%2BBnipQb2Ek9oT2TZhUAd5EY16JxcuGGTDfZhTAnnPo%3D'
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "::add-mask::$env:ARTIFACT_URL"
          $archive=Join-Path $env:RUNNER_TEMP 'erp-1174-artifact.zip'
          $extract=Join-Path $env:RUNNER_TEMP 'erp-1174-release'
          Invoke-WebRequest -Uri $env:ARTIFACT_URL -OutFile $archive
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'dc403358071f9f9402762655d38c6d29db44f2f2f77338af6fb926de91f9b4ae'){throw 'Artifact hash mismatch'}
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $manifest=Get-Content (Join-Path $extract 'latest.json') -Raw | ConvertFrom-Json
          if($manifest.version -ne '1.1.174'){throw 'Unexpected version'}
          $package=Join-Path $extract 'INITIALTEC_ERP_Update_1.1.174.zip'
          if((Get-Item $package).Length -ne $manifest.sizeBytes){throw 'Package size mismatch'}
          if((Get-FileHash $package -Algorithm SHA256).Hash -ne $manifest.sha256){throw 'Package hash mismatch'}
          $current=Get-Content latest.json -Raw | ConvertFrom-Json
          if([version]$current.version -gt [version]$manifest.version){throw 'A newer release is published'}
          $inspect=Join-Path $env:RUNNER_TEMP 'erp-1174-package'
          Expand-Archive -LiteralPath $package -DestinationPath $inspect
          if((Get-Content (Join-Path $inspect 'ERP_CLIENT_VERSION.txt') -Raw).Trim() -ne '1.1.174'){throw 'Internal version mismatch'}
          if(-not(Test-Path (Join-Path $inspect 'INITIALTEC_ERP.exe'))){throw 'Missing executable'}
          Copy-Item -LiteralPath $package -Destination 'INITIALTEC_ERP_Update_1.1.174.zip' -Force
          Copy-Item -LiteralPath (Join-Path $extract 'INITIALTEC_ERP_Setup.exe') -Destination 'INITIALTEC_ERP_Setup.exe' -Force
          Copy-Item -LiteralPath (Join-Path $extract 'latest.json') -Destination 'latest.json' -Force
          git config user.name 'INITIALTEC ERP Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add INITIALTEC_ERP_Update_1.1.174.zip INITIALTEC_ERP_Setup.exe latest.json
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){exit 0}
          git commit -m 'release: ERP 1.1.174 clean dashboard production status'
          if($LASTEXITCODE -ne 0){throw 'Commit failed'}
          git push origin main
          if($LASTEXITCODE -ne 0){throw 'Push failed'}
