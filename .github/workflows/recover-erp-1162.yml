name: Recover ERP 1.1.162 update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-erp-1162.yml']
permissions:
  contents: write
concurrency:
  group: recover-erp-1162
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish completed ERP artifact
        shell: pwsh
        env:
          ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-fcc0-8206-9c86-b5d62bf74a54/raw?se=2026-10-07T04%3A40%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=924ddf71-5716-47f9-81cf-0559c8c4823c&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T21%3A49%3A51Z&ske=2026-10-07T21%3A49%3A51Z&sks=b&skv=2026-02-06&sig=1zPEkRXnlkX2GV2H6OGL4F8mE/NYjYGTxxFF4l6RWcI%3D'
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'erp-1162-artifact.zip'
          $extract=Join-Path $env:RUNNER_TEMP 'erp-1162-release'
          Invoke-WebRequest -Uri $env:ARTIFACT_URL -OutFile $archive
          $artifactHash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if($artifactHash -ne 'da4d8d0f2c2ebb4ef8fcfccb10b0a90ccbcb824efe1265f487aae1b813e65c48'){throw 'Build artifact hash mismatch'}
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $manifest=Get-Content (Join-Path $extract 'latest.json') -Raw | ConvertFrom-Json
          if($manifest.version -ne '1.1.162'){throw 'Unexpected release version'}
          $package=Join-Path $extract 'INITIALTEC_ERP_Update_1.1.162.zip'
          if((Get-Item $package).Length -ne $manifest.sizeBytes){throw 'Package size mismatch'}
          if((Get-FileHash $package -Algorithm SHA256).Hash -ne $manifest.sha256){throw 'Package hash mismatch'}
          $current=Get-Content latest.json -Raw | ConvertFrom-Json
          if([version]$current.version -gt [version]$manifest.version){throw 'A newer release is already published'}
          $inspect=Join-Path $env:RUNNER_TEMP 'erp-1162-package'
          Expand-Archive -LiteralPath $package -DestinationPath $inspect
          if((Get-Content (Join-Path $inspect 'ERP_CLIENT_VERSION.txt') -Raw).Trim() -ne '1.1.162'){throw 'Package version mismatch'}
          if(-not(Test-Path (Join-Path $inspect 'INITIALTEC_ERP.exe'))){throw 'ERP executable missing'}
          Copy-Item -LiteralPath $package -Destination 'INITIALTEC_ERP_Update_1.1.162.zip' -Force
          Copy-Item -LiteralPath (Join-Path $extract 'INITIALTEC_ERP_Setup.exe') -Destination 'INITIALTEC_ERP_Setup.exe' -Force
          Copy-Item -LiteralPath (Join-Path $extract 'latest.json') -Destination 'latest.json' -Force
          git config user.name 'INITIALTEC ERP Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add INITIALTEC_ERP_Update_1.1.162.zip INITIALTEC_ERP_Setup.exe latest.json
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){exit 0}
          git commit -m 'release: recover ERP 1.1.162 verified build artifact'
          if($LASTEXITCODE -ne 0){throw 'Release commit failed'}
          git push origin main
          if($LASTEXITCODE -ne 0){throw 'Release push failed'}
