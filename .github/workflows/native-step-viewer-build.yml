name: Native STEP Viewer Build Test

on:
  push:
    branches:
      - native-step-viewer-build-v030

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-step-viewer-build-v030
      - name: Write marker
        shell: pwsh
        run: |
          @(
            "run_id=${{ github.run_id }}",
            "sha=${{ github.sha }}",
            "runner=windows"
          ) | Set-Content -Encoding ASCII "RUN_ID.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RUN_ID.txt
          git commit -m "Build marker [skip ci]"
          git push origin HEAD:native-step-viewer-build-v030
